name: Fetch Agile price history

on:
  push:
    paths:
      - .github/workflows/fetch-agile-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rates
        run: |
          mkdir -p data
          # CORS check for the Glowmarkt (Bright) API, no credentials involved
          curl -s -o /dev/null -D - -X OPTIONS https://api.glowmarkt.com/api/v0-1/auth \
            -H "Origin: https://halfpen.github.io" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,applicationid,token" | grep -i -E "^HTTP|access-control" || true
          curl -s -o /dev/null -D - https://api.glowmarkt.com/api/v0-1/virtualentity \
            -H "Origin: https://halfpen.github.io" | grep -i -E "^HTTP|access-control" || true
      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Add Agile price history"
          git push
