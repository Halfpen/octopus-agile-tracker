name: Fetch Agile price history

on:
  push:
    paths:
      - .github/workflows/fetch-agile-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rates
        run: |
          mkdir -p data
          python3 notify/fixed_gas_offers.py data/octopus-fixed-offers-G.csv G
      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Add Agile price history"
          git push
